[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trilingual-career-agent"
version = "0.2.0"
description = "Evidence-based career agent — Phase 2 discovery and evaluation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3", "SQLAlchemy>=2.0.45,<2.1", "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4", "PyYAML>=6.0.3,<7",
  "httpx>=0.28,<0.29", "streamlit>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[project.scripts]
career-agent = "career_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
